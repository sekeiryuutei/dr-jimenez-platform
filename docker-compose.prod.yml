# Produccion: frontend optimizado + Caddy con HTTPS automatico.
# Uso: cp .env.prod.example .env.prod  # rellenar, sobre todo DOMAIN
#      docker compose -f docker-compose.prod.yml up -d --build
# Solo Caddy expone puertos (80/443). Nada de dev, nada de Render.
name: drjimenez-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drjimenez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-drjimenez}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drjimenez}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-drjimenez}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-drjimenez}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
